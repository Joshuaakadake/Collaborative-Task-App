version: '3.8'

services:
  # 1. The Database (PostgreSQL)
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: joshua_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: task_manager_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # 2. The Backend (Sophie's Node.js Server)
  server:
    build: ./server
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://joshua_admin:password123@db:5432/task_manager_db

  # 3. The Frontend (Wendy's React App)
  client:
    build: ./client
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

volumes:
  db-data: