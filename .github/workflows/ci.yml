name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install backend dependencies
      run: |
        cd server
        npm install
    
    - name: Check backend syntax
      run: |
        cd server
        node -c server.js

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install frontend dependencies
      run: |
        cd client
        npm install
    
    - name: Build frontend
      run: |
        cd client
        CI=false npm run build

  done:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    
    steps:
    - name: Success message
      run: echo "All tests passed! Code is good to merge."